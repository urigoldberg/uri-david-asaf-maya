<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>אימפריית הנדל״ן - משפחת גולדברג</title>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #D4AF37;
            --gold-light: #F3E5AB;
            --navy: #0A192F;
            --navy-light: #172A45;
            --bg: #F0F4F8;
            --card-bg: #FFFFFF;
            --text-dark: #2C3E50;
            --text-light: #7F8C8D;
            --border: #E2E8F0;
            --bit-color: #00B0F0;
            --wa-color: #25D366;
            --danger: #E74C3C;
        }

        body {
            font-family: 'Rubik', sans-serif;
            background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%);
            color: var(--text-dark);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            max-width: 600px;
            width: 100%;
        }

        .header {
            text-align: center;
            color: var(--gold);
            margin-bottom: 30px;
        }

        .header h1 {
            margin: 0;
            font-size: 28px;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            margin: 5px 0 0 0;
            color: #CCD6F6;
            font-size: 16px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            border-top: 5px solid var(--gold);
        }

        h2, h3 {
            color: var(--navy);
            margin-top: 0;
            margin-bottom: 20px;
            font-weight: 700;
        }

        .form-group {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        input, select, button {
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 16px;
            font-family: inherit;
        }

        input {
            flex: 1;
            min-width: 120px;
            background-color: #F8FAFC;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.2);
        }

        button {
            background-color: var(--navy);
            color: var(--gold);
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        button:hover {
            background-color: var(--navy-light);
            transform: translateY(-2px);
        }

        .btn-primary { width: 100%; font-size: 18px; padding: 14px; }
        .btn-secondary { background-color: #EDF2F7; color: var(--navy); }
        .btn-secondary:hover { background-color: #E2E8F0; }
        .btn-danger { background-color: #FEF2F2; color: var(--danger); }
        .btn-danger:hover { background-color: #FEE2E2; }

        .house-item {
            background: #F8FAFC;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid var(--border);
        }

        .house-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .house-header h4 {
            margin: 0;
            font-size: 18px;
            color: var(--navy);
        }

        .delete-btn {
            background-color: transparent;
            color: var(--danger);
            padding: 6px 12px;
            font-size: 14px;
            border: 1px solid var(--danger);
        }

        .summary-stats {
            display: flex;
            justify-content: space-between;
            background: var(--gold-light);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 24px;
            text-align: center;
        }

        .summary-stats div {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .summary-stats span {
            color: var(--navy);
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .summary-stats strong {
            font-size: 26px;
            color: var(--navy);
        }

        .transfer-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .transfer-item {
            background: #F8FAFC;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 12px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .transfer-text {
            font-size: 16px;
            color: var(--text-dark);
        }

        .transfer-actions {
            display: flex;
            gap: 10px;
        }

        .action-link {
            flex: 1;
            text-decoration: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            text-align: center;
            color: white;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .bit-btn { background-color: var(--bit-color); }
        .wa-btn { background-color: var(--wa-color); }

        .app-actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        .app-actions button { flex: 1; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>👑 משפחת גולדברג</h1>
        <p>ניהול אימפריית הנדל״ן</p>
    </div>

    <div class="card">
        <h2>הוספת נכס</h2>
        <div class="form-group">
            <input type="text" id="houseName" placeholder="שם הנכס (לדוג׳ פלורנטין)">
            <input type="number" id="regularRent" placeholder="שכירות רגילה (₪)">
        </div>
        <button class="btn-primary" onclick="addHouse()">+ הוסף נכס לאימפריה</button>
    </div>

    <div class="card" id="housesContainer" style="display: none;">
        <h2>נכסים וגבייה החודש</h2>
        <div id="housesList"></div>
    </div>

    <div class="card" id="summaryContainer" style="display: none;">
        <h2>התחשבנות חודשית</h2>
        <div class="summary-stats">
            <div>
                <span>סה״כ הכנסות</span>
                <strong id="totalIncome">0</strong>
            </div>
            <div>
                <span>חלק לכל אח</span>
                <strong id="perBrother">0</strong>
            </div>
        </div>

        <h3>העברות לביצוע</h3>
        <ul class="transfer-list" id="transferList"></ul>
    </div>

    <div class="app-actions">
        <button class="btn-secondary" onclick="shareApp()">🔗 שתף קישור לאחים</button>
        <button class="btn-danger" onclick="clearData()">🗑 איפוס נתונים</button>
    </div>
</div>

<script>
    const BROTHERS = ['אורי', 'דוד', 'אסף', 'מאיה'];
    let state = { houses: [] };

    function init() {
        loadData();
        render();
    }

    function loadData() {
        const urlParams = new URLSearchParams(window.location.search);
        const sharedData = urlParams.get('data');
        
        if (sharedData) {
            try {
                state = JSON.parse(decodeURIComponent(atob(sharedData)));
                window.history.replaceState({}, document.title, window.location.pathname);
                saveData(); 
            } catch (e) {
                console.error("שגיאה בטעינת נתונים.", e);
            }
        } else {
            const stored = localStorage.getItem('goldbergRentData');
            if (stored) state = JSON.parse(stored);
        }
    }

    function saveData() {
        localStorage.setItem('goldbergRentData', JSON.stringify(state));
    }

    function addHouse() {
        const nameInput = document.getElementById('houseName');
        const rentInput = document.getElementById('regularRent');
        const name = nameInput.value.trim();
        const rent = parseFloat(rentInput.value);

        if (!name || isNaN(rent) || rent <= 0) {
            alert('נא להזין שם נכס וסכום שכירות תקינים.');
            return;
        }

        state.houses.push({
            id: Date.now().toString(),
            name: name,
            regularRent: rent,
            overrideRent: null,
            collector: BROTHERS[0] 
        });

        nameInput.value = '';
        rentInput.value = '';
        saveAndRender();
    }

    function deleteHouse(id) {
        if(confirm("להסיר את הנכס הזה?")) {
            state.houses = state.houses.filter(h => h.id !== id);
            saveAndRender();
        }
    }

    function updateHouse(id, field, value) {
        const house = state.houses.find(h => h.id === id);
        if (house) {
            if (field === 'overrideRent') {
                house.overrideRent = value === '' ? null : parseFloat(value);
            } else {
                house[field] = value;
            }
            saveAndRender();
        }
    }

    function clearData() {
        if(confirm("האם אתה בטוח שברצונך לאפס את כל הנתונים?")) {
            state.houses = [];
            saveAndRender();
        }
    }

    function shareApp() {
        const encodedData = btoa(encodeURIComponent(JSON.stringify(state)));
        const shareUrl = `${window.location.origin}${window.location.pathname}?data=${encodedData}`;
        
        if (navigator.clipboard) {
            navigator.clipboard.writeText(shareUrl).then(() => {
                alert("הקישור הועתק! אפשר להדביק בוואטסאפ של המשפחה.");
            }).catch(err => {
                prompt("העתק את הקישור הזה:", shareUrl);
            });
        } else {
            prompt("העתק את הקישור הזה:", shareUrl);
        }
    }

    function saveAndRender() {
        saveData();
        render();
    }

    function render() {
        renderHouses();
        renderSummary();
    }

    function renderHouses() {
        const container = document.getElementById('housesContainer');
        const list = document.getElementById('housesList');
        
        if (state.houses.length === 0) {
            container.style.display = 'none';
            return;
        }
        
        container.style.display = 'block';
        list.innerHTML = '';

        state.houses.forEach(house => {
            let html = `
                <div class="house-item">
                    <div class="house-header">
                        <h4>${house.name} <small style="color:var(--text-light); font-weight:normal;">(רגיל: ₪${house.regularRent})</small></h4>
                        <button class="delete-btn" onclick="deleteHouse('${house.id}')">מחק</button>
                    </div>
                    <div class="form-group" style="margin-bottom:0;">
                        <input type="number" 
                               placeholder="סכום שנגבה בפועל (אופציונלי)" 
                               value="${house.overrideRent !== null ? house.overrideRent : ''}"
                               onchange="updateHouse('${house.id}', 'overrideRent', this.value)">
                        <select onchange="updateHouse('${house.id}', 'collector', this.value)">
                            ${BROTHERS.map(b => `<option value="${b}" ${house.collector === b ? 'selected' : ''}>${b} גבה/תה</option>`).join('')}
                        </select>
                    </div>
                </div>
            `;
            list.insertAdjacentHTML('beforeend', html);
        });
    }

    function renderSummary() {
        const container = document.getElementById('summaryContainer');
        if (state.houses.length === 0) {
            container.style.display = 'none';
            return;
        }
        
        container.style.display = 'block';

        let totalIncome = 0;
        let collectedByBrother = { 'אורי': 0, 'דוד': 0, 'אסף': 0, 'מאיה': 0 };

        state.houses.forEach(house => {
            const amount = house.overrideRent !== null ? house.overrideRent : house.regularRent;
            totalIncome += amount;
            collectedByBrother[house.collector] += amount;
        });

        const perBrother = totalIncome / 4;

        document.getElementById('totalIncome').innerText = '₪' + totalIncome.toFixed(0);
        document.getElementById('perBrother').innerText = '₪' + perBrother.toFixed(0);

        let debtors = [];
        let creditors = [];

        BROTHERS.forEach(b => {
            let balance = collectedByBrother[b] - perBrother;
            if (balance > 0.01) debtors.push({ name: b, amount: balance });
            if (balance < -0.01) creditors.push({ name: b, amount: Math.abs(balance) });
        });

        let transfers = [];
        let i = 0; let j = 0;

        while (i < debtors.length && j < creditors.length) {
            let debtor = debtors[i];
            let creditor = creditors[j];
            let transferAmount = Math.min(debtor.amount, creditor.amount);

            transfers.push({
                from: debtor.name,
                to: creditor.name,
                amount: transferAmount
            });

            debtor.amount -= transferAmount;
            creditor.amount -= transferAmount;

            if (debtor.amount < 0.01) i++;
            if (creditor.amount < 0.01) j++;
        }

        const transferList = document.getElementById('transferList');
        transferList.innerHTML = '';

        if (transfers.length === 0) {
            transferList.innerHTML = '<li class="transfer-item" style="text-align:center;">הכל מאוזן! אין צורך בהעברות. 🎉</li>';
        } else {
            transfers.forEach(t => {
                const amountText = t.amount.toFixed(0);
                const waMessage = encodeURIComponent(`היי ${t.to}, אני חייב/ת לך ₪${amountText} על השכירות של החודש. מעביר/ה בביט! 💸`);
                
                transferList.insertAdjacentHTML('beforeend', `
                    <li class="transfer-item">
                        <div class="transfer-text">
                            <strong>${t.from}</strong> צריך/ה להעביר ל<strong>${t.to}</strong>: ₪${amountText}
                        </div>
                        <div class="transfer-actions">
                            <a href="bitpay://" class="action-link bit-btn">📱 פתח ביט</a>
                            <a href="https://wa.me/?text=${waMessage}" target="_blank" class="action-link wa-btn">💬 סמס בווטסאפ</a>
                        </div>
                    </li>
                `);
            });
        }
    }

    init();
</script>
</body>
</html>
